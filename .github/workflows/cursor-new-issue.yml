name: Cursor new issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-26.04
    steps:
      - name: POST issue context to Cursor
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_ISSUE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_ISSUE_WEBHOOK_KEY }}
        run: |
          set -o pipefail
          key=$(printf '%s' "$WEBHOOK_KEY" | tr -d '\r\n')
          if [ -z "$WEBHOOK_URL" ] || [ -z "$key" ]; then
            echo "CURSOR_ISSUE_WEBHOOK_URL or CURSOR_ISSUE_WEBHOOK_KEY is empty." >&2
            exit 1
          fi
          jq -c '{context: "number: \(.issue.number)\ntitle: \(.issue.title)\nhtml_url: \(.issue.html_url)\nbody:\n\(.issue.body // "")"}' "$GITHUB_EVENT_PATH" \
            | curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer ${key}" \
              -H "Content-Type: application/json" \
              --data-binary @-
